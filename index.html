<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Display Controller</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0a;color:#fff;font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:30px 20px;gap:16px}
  h1{font-size:1.8rem;color:#00ffff}
  .subtitle{color:#666;font-size:.9rem}
  .status{padding:10px 24px;border-radius:20px;font-size:.9rem;background:#1a1a1a;border:1px solid #333;transition:all .3s}
  .status.connected{border-color:#00ff88;color:#00ff88}
  .status.disconnected{border-color:#ff4444;color:#ff4444}
  button{background:#00ffff;color:#000;border:none;padding:12px 28px;border-radius:10px;font-size:1rem;font-weight:bold;cursor:pointer;transition:opacity .2s}
  button:hover{opacity:.85}
  button:disabled{opacity:.3;cursor:not-allowed}
  .card{background:#111;border:1px solid #222;border-radius:16px;padding:20px;width:100%;max-width:480px}
  .card h2{font-size:1rem;color:#aaa;margin-bottom:14px}
  textarea{width:100%;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;padding:10px;font-size:1rem;resize:none;height:80px;margin-bottom:10px}
  textarea:focus{outline:none;border-color:#00ffff}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn-row button{flex:1;min-width:80px;padding:10px;font-size:.9rem}
  .btn-secondary{background:#222;color:#fff;border:1px solid #444}
  .shape-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .shape-grid button{padding:14px;font-size:.95rem;background:#1a1a1a;color:#fff;border:1px solid #444}
  .shape-grid button:hover:not(:disabled){border-color:#00ffff;color:#00ffff}
  .log{width:100%;max-width:480px;background:#0d0d0d;border:1px solid #1a1a1a;border-radius:10px;padding:10px;font-size:.75rem;color:#555;height:80px;overflow-y:auto;font-family:monospace}
  .canvas-wrap{position:relative;width:260px;height:260px;margin:0 auto}
  #drawCanvas{border-radius:50%;cursor:crosshair;background:#000;border:2px solid #333;display:block;touch-action:none}
  .canvas-tools{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .color-btn{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .2s}
  .color-btn.active{border-color:#fff;transform:scale(1.2)}
  input[type=range]{flex:1;accent-color:#00ffff}
  .img-drop{border:2px dashed #333;border-radius:12px;padding:20px;text-align:center;color:#555;cursor:pointer;transition:border-color .2s}
  .img-drop:hover{border-color:#00ffff;color:#00ffff}
  .img-drop input{display:none}
  #imgPreview{display:none;border-radius:50%;margin-top:10px;width:120px;height:120px}
  progress{width:100%;height:8px;border-radius:4px;margin-top:10px;accent-color:#00ffff;display:none}
  #imgSendBtn{display:none;margin-top:10px}
</style>
</head>
<body>

<h1>⬡ VR Display</h1>
<p class="subtitle">Bluetooth controller for XIAO ESP32-C3</p>
<div class="status disconnected" id="status">● Not connected</div>
<button onclick="connect()" id="connectBtn">Connect via Bluetooth</button>

<div class="card">
  <h2>💬 Send Message</h2>
  <textarea id="msgInput" placeholder="Type a message..." maxlength="60"></textarea>
  <div class="btn-row">
    <button onclick="sendText()" id="sendBtn" disabled>Send</button>
    <button class="btn-secondary" onclick="sendCmd('CLEAR')" id="clearBtn" disabled>Clear</button>
  </div>
</div>

<div class="card">
  <h2>🔷 Shapes</h2>
  <div class="shape-grid">
    <button class="shapeBtn" onclick="sendCmd('PHASE:0')" disabled>🟦 Cube</button>
    <button class="shapeBtn" onclick="sendCmd('PHASE:1')" disabled>🔺 Pyramid</button>
    <button class="shapeBtn" onclick="sendCmd('PHASE:2')" disabled>💎 Diamond</button>
    <button class="shapeBtn" onclick="sendCmd('PHASE:3')" disabled>⭐ Star</button>
  </div>
  <br>
  <div class="btn-row">
    <button class="btn-secondary shapeBtn" onclick="sendCmd('PREV')" disabled>⟵ Prev</button>
    <button class="btn-secondary shapeBtn" onclick="sendCmd('AUTO')" disabled>⟳ Auto</button>
    <button class="btn-secondary shapeBtn" onclick="sendCmd('NEXT')" disabled>Next ⟶</button>
  </div>
</div>

<div class="card">
  <h2>✏️ Draw (live)</h2>
  <div class="canvas-wrap">
    <canvas id="drawCanvas" width="240" height="240"></canvas>
  </div>
  <div class="canvas-tools">
    <span style="color:#aaa;font-size:.85rem">Color:</span>
    <div class="color-btn active" style="background:#ffffff" onclick="setColor('#ffffff',this)"></div>
    <div class="color-btn" style="background:#00ffff" onclick="setColor('#00ffff',this)"></div>
    <div class="color-btn" style="background:#ff4444" onclick="setColor('#ff4444',this)"></div>
    <div class="color-btn" style="background:#44ff44" onclick="setColor('#44ff44',this)"></div>
    <div class="color-btn" style="background:#ffff00" onclick="setColor('#ffff00',this)"></div>
    <div class="color-btn" style="background:#ff44ff" onclick="setColor('#ff44ff',this)"></div>
    <div class="color-btn" style="background:#000000;border:1px solid #444" onclick="setColor('#000000',this)"></div>
  </div>
  <div class="canvas-tools">
    <span style="color:#aaa;font-size:.85rem">Size:</span>
    <input type="range" id="brushSize" min="1" max="20" value="3">
    <span id="brushLabel" style="color:#aaa;font-size:.85rem">3px</span>
  </div>
  <br>
  <div class="btn-row">
    <button class="btn-secondary" id="clearDrawBtn" onclick="clearDraw()" disabled>🗑 Clear</button>
  </div>
</div>

<div class="card">
  <h2>🖼 Send Image</h2>
  <div class="img-drop" onclick="document.getElementById('imgFile').click()">
    <input type="file" id="imgFile" accept="image/*" onchange="loadImage(event)">
    <p>Click to choose an image</p>
    <p style="font-size:.8rem;margin-top:6px">Cropped & resized to 240×240</p>
  </div>
  <img id="imgPreview">
  <progress id="imgProgress" value="0" max="100"></progress>
  <button id="imgSendBtn" onclick="sendImage()" disabled>📤 Send Image</button>
</div>

<div class="log" id="log">Waiting for connection...</div>

<script>
const SERVICE_UUID='6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHAR_UUID='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
let characteristic=null;
let drawColor='#ffffff';
let brushSize=3;
let drawing=false;
let lastX=0,lastY=0;
let drawingActive=false;
let imgPixels=null;
let sendQueue=[];
let sending=false;

function log(msg){const el=document.getElementById('log');el.innerHTML+=`<div>> ${msg}</div>`;el.scrollTop=el.scrollHeight;}

function setConnected(val){
  document.getElementById('status').textContent=val?'● Connected to VR-Display':'● Not connected';
  document.getElementById('status').className='status '+(val?'connected':'disconnected');
  document.getElementById('connectBtn').textContent=val?'Disconnect':'Connect via Bluetooth';
  document.querySelectorAll('#sendBtn,#clearBtn,#clearDrawBtn,.shapeBtn').forEach(b=>b.disabled=!val);
  if(val&&imgPixels)document.getElementById('imgSendBtn').disabled=false;
}

async function connect(){
  if(characteristic){characteristic=null;setConnected(false);log('Disconnected');return;}
  try{
    log('Scanning...');
    const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE_UUID]});
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE_UUID);
    characteristic=await service.getCharacteristic(CHAR_UUID);
    setConnected(true);
    log('Connected!');
    device.addEventListener('gattserverdisconnected',()=>{characteristic=null;setConnected(false);log('Disconnected');});
  }catch(e){log('Error: '+e.message);}
}

// ── Queue ─────────────────────────────────────────────
async function processQueue(){
  if(sending||sendQueue.length===0)return;
  sending=true;
  while(sendQueue.length>0){
    if(!characteristic)break;
    const item=sendQueue.shift();
    try{
      if(item instanceof Uint8Array)
        await characteristic.writeValueWithoutResponse(item);
      else
        await characteristic.writeValue(new TextEncoder().encode(item+'\n'));
    }catch(e){
      await sleep(15);
      try{
        if(item instanceof Uint8Array)
          await characteristic.writeValueWithoutResponse(item);
      }catch(e2){}
    }
    await sleep(6);
  }
  sending=false;
}

function queue(item){sendQueue.push(item);processQueue();}

async function sendCmd(cmd){
  if(!characteristic)return;
  // Flush queue first for commands
  sendQueue=[];
  sending=false;
  try{
    await characteristic.writeValue(new TextEncoder().encode(cmd+'\n'));
    log('Sent: '+cmd);
  }catch(e){log('Error: '+e.message);}
}

function sendText(){
  const msg=document.getElementById('msgInput').value.trim();
  if(msg)sendCmd('TEXT:'+msg);
}
document.getElementById('msgInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}
});

// ── Canvas ────────────────────────────────────────────
const canvas=document.getElementById('drawCanvas');
const ctx=canvas.getContext('2d');
ctx.fillStyle='#000';ctx.fillRect(0,0,240,240);

function setColor(col,btn){
  drawColor=col;
  document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

const brushEl=document.getElementById('brushSize');
brushEl.addEventListener('input',function(){
  brushSize=parseInt(this.value);
  document.getElementById('brushLabel').textContent=brushSize+'px';
  // Show preview dot on canvas
  ctx.fillStyle=drawColor;
  ctx.beginPath();
  ctx.arc(20,20,brushSize/2,0,Math.PI*2);
  ctx.fill();
});

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  return{x:Math.round((t.clientX-r.left)*(240/r.width)),y:Math.round((t.clientY-r.top)*(240/r.height))};
}

function hexToRgb(hex){
  return{r:parseInt(hex.slice(1,3),16),g:parseInt(hex.slice(3,5),16),b:parseInt(hex.slice(5,7),16)};
}

function makeDRW(x1,y1,x2,y2,r,g,b,size){
  const buf=new Uint8Array(15);
  buf[0]=68;buf[1]=82;buf[2]=87;
  buf[3]=(x1>>8)&0xFF;buf[4]=x1&0xFF;
  buf[5]=(y1>>8)&0xFF;buf[6]=y1&0xFF;
  buf[7]=(x2>>8)&0xFF;buf[8]=x2&0xFF;
  buf[9]=(y2>>8)&0xFF;buf[10]=y2&0xFF;
  buf[11]=r;buf[12]=g;buf[13]=b;
  buf[14]=size;
  return buf;
}

function startDraw(e){
  drawing=true;
  const p=getPos(e);lastX=p.x;lastY=p.y;
  if(!drawingActive&&characteristic){
    drawingActive=true;
    sendCmd('DRAWCLEAR');
  }
}

function doDrawMove(e){
  if(!drawing)return;
  const p=getPos(e);
  ctx.strokeStyle=drawColor;ctx.lineWidth=brushSize;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();
  if(characteristic){
    const{r,g,b}=hexToRgb(drawColor);
    queue(makeDRW(lastX,lastY,p.x,p.y,r,g,b,brushSize));
  }
  lastX=p.x;lastY=p.y;
}

canvas.addEventListener('mousedown',startDraw);
canvas.addEventListener('mousemove',doDrawMove);
canvas.addEventListener('mouseup',()=>drawing=false);
canvas.addEventListener('mouseleave',()=>drawing=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();startDraw(e);},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();doDrawMove(e);},{passive:false});
canvas.addEventListener('touchend',()=>drawing=false);

function clearDraw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,240,240);
  drawingActive=false;
  sendQueue=[];sending=false;
  sendCmd('DRAWCLEAR');
  log('Canvas cleared');
}

// ── Image ─────────────────────────────────────────────
const offscreen=document.createElement('canvas');
offscreen.width=240;offscreen.height=240;
const octx=offscreen.getContext('2d');

function loadImage(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const size=Math.min(img.width,img.height);
      const sx=(img.width-size)/2,sy=(img.height-size)/2;
      octx.clearRect(0,0,240,240);
      octx.drawImage(img,sx,sy,size,size,0,0,240,240);
      imgPixels=octx.getImageData(0,0,240,240);
      const prev=document.getElementById('imgPreview');
      prev.src=offscreen.toDataURL();
      prev.style.display='block';
      const btn=document.getElementById('imgSendBtn');
      btn.style.display='block';
      btn.disabled=!characteristic;
      log('Image ready — '+img.width+'×'+img.height);
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function makeRow(y){
  const row=new Uint8Array(6+240*2);
  row[0]=73;row[1]=77;row[2]=71;row[3]=58;
  row[4]=(y>>8)&0xFF;row[5]=y&0xFF;
  for(let x=0;x<240;x++){
    const i=(y*240+x)*4;
    const r=imgPixels.data[i],g=imgPixels.data[i+1],b=imgPixels.data[i+2];
    const rgb=((r&0xF8)<<8)|((g&0xFC)<<3)|(b>>3);
    row[6+x*2]=(rgb>>8)&0xFF;
    row[6+x*2+1]=rgb&0xFF;
  }
  return row;
}

async function sendRow(y){
  const row=makeRow(y);
  try{await characteristic.writeValueWithoutResponse(row);}
  catch(e){await sleep(20);try{await characteristic.writeValueWithoutResponse(row);}catch(e2){}}
  await sleep(8);
}

async function sendImage(){
  if(!characteristic||!imgPixels)return;
  document.getElementById('imgSendBtn').disabled=true;
  const prog=document.getElementById('imgProgress');
  prog.style.display='block';prog.value=0;

  await sendCmd('IMGSTART');
  await sleep(400);

  // Pass 1 — every 8th row (instant rough preview)
  log('Pass 1 — rough preview...');
  for(let y=0;y<=239;y+=8){await sendRow(y);prog.value=(y/240*25)|0;}

  // Pass 2 — every 4th row
  log('Pass 2 — filling...');
  for(let y=4;y<=239;y+=8){await sendRow(y);prog.value=25+((y/240*25)|0);}

  // Pass 3 — every 2nd row
  log('Pass 3 — detail...');
  for(let y=2;y<=239;y+=4){await sendRow(y);prog.value=50+((y/240*25)|0);}

  // Pass 4 — all remaining rows including y=239
  log('Pass 4 — full res...');
  for(let y=1;y<=239;y+=2){await sendRow(y);prog.value=75+((y/240*25)|0);}

  // Final pass — make sure every single row including 239 is sent
  await sendRow(239);
  await sendCmd('IMGDONE');

  prog.value=100;
  log('Done!');
  document.getElementById('imgSendBtn').disabled=false;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
</body>
</html>
