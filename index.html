<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Display Controller</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }
    h1 { font-size: 1.8rem; color: #00ffff; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 30px; }
    .status {
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 24px;
      background: #1a1a1a;
      border: 1px solid #333;
      transition: all 0.3s;
    }
    .status.connected { border-color: #00ff88; color: #00ff88; }
    .status.disconnected { border-color: #ff4444; color: #ff4444; }
    button {
      background: #00ffff;
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.3; cursor: not-allowed; }
    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
    }
    .card h2 { font-size: 1rem; color: #aaa; margin-bottom: 14px; }
    textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 1rem;
      resize: none;
      height: 80px;
      margin-bottom: 10px;
    }
    textarea:focus { outline: none; border-color: #00ffff; }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn-row button {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      font-size: 0.9rem;
    }
    .btn-secondary {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }
    .btn-red {
      background: #ff4444;
      color: #fff;
    }
    .shape-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .shape-grid button {
      padding: 14px;
      font-size: 0.95rem;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #444;
    }
    .shape-grid button:hover { border-color: #00ffff; color: #00ffff; }
    .log {
      width: 100%;
      max-width: 420px;
      background: #0d0d0d;
      border: 1px solid #1a1a1a;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.75rem;
      color: #555;
      height: 80px;
      overflow-y: auto;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h1>⬡ VR Display</h1>
  <p class="subtitle">Bluetooth controller for XIAO ESP32-C3</p>

  <div class="status disconnected" id="status">● Not connected</div>
  <button id="connectBtn" onclick="connect()">Connect via Bluetooth</button>

  <br>

  <div class="card">
    <h2>💬 Send Message</h2>
    <textarea id="msgInput" placeholder="Type a message to display..." maxlength="60"></textarea>
    <div class="btn-row">
      <button onclick="sendText()" id="sendBtn" disabled>Send</button>
      <button class="btn-secondary" onclick="sendCmd('CLEAR')" id="clearBtn" disabled>Clear</button>
    </div>
  </div>

  <div class="card">
    <h2>🔷 Shapes</h2>
    <div class="shape-grid">
      <button onclick="sendCmd('PHASE:0')" id="ctrl" disabled>Cube</button>
      <button onclick="sendCmd('PHASE:1')" id="ctrl" disabled>Pyramid</button>
      <button onclick="sendCmd('PHASE:2')" id="ctrl" disabled>Diamond</button>
      <button onclick="sendCmd('PHASE:3')" id="ctrl" disabled>Star</button>
    </div>
  </div>

  <div class="card">
    <h2>⏩ Playback</h2>
    <div class="btn-row">
      <button class="btn-secondary" onclick="sendCmd('PREV')" id="ctrl" disabled>⟵ Prev</button>
      <button class="btn-secondary" onclick="sendCmd('AUTO')" id="ctrl" disabled>⟳ Auto</button>
      <button class="btn-secondary" onclick="sendCmd('NEXT')" id="ctrl" disabled>Next ⟶</button>
    </div>
  </div>

  <div class="log" id="log">Waiting for connection...</div>

<script>
  const SERVICE_UUID  = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
  const CHAR_UUID     = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

  let characteristic = null;

  function log(msg) {
    const el = document.getElementById('log');
    el.innerHTML += `<div>> ${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  function setConnected(val) {
    const status = document.getElementById('status');
    const btns   = document.querySelectorAll('#ctrl, #sendBtn, #clearBtn');
    status.textContent = val ? '● Connected to VR-Display' : '● Not connected';
    status.className   = 'status ' + (val ? 'connected' : 'disconnected');
    btns.forEach(b => b.disabled = !val);
    document.getElementById('connectBtn').textContent = val ? 'Disconnect' : 'Connect via Bluetooth';
  }

  async function connect() {
    if (characteristic) {
      characteristic = null;
      setConnected(false);
      log('Disconnected');
      return;
    }
    try {
      log('Scanning for VR-Display...');
      const device = await navigator.bluetooth.requestDevice({
  acceptAllDevices: true,
  optionalServices: [SERVICE_UUID]
});
      log('Found device, connecting...');
      const server  = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      characteristic = await service.getCharacteristic(CHAR_UUID);
      setConnected(true);
      log('Connected! Send a command below.');
      device.addEventListener('gattserverdisconnected', () => {
        characteristic = null;
        setConnected(false);
        log('Device disconnected');
      });
    } catch(e) {
      log('Error: ' + e.message);
    }
  }

  async function sendCmd(cmd) {
    if (!characteristic) return;
    try {
      const enc = new TextEncoder();
      await characteristic.writeValue(enc.encode(cmd + '\n'));
      log('Sent: ' + cmd);
    } catch(e) {
      log('Error: ' + e.message);
    }
  }

  function sendText() {
    const msg = document.getElementById('msgInput').value.trim();
    if (msg) sendCmd('TEXT:' + msg);
  }

  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
  });
</script>
</body>
</html>
