<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const CHAR_UUID    = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';

let characteristic = null;
let imgPixels = null;

function log(msg){
  const el=document.getElementById('log');
  el.innerHTML+=`<div>> ${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

// ── CONNECT ──
function setConnected(val){
  document.querySelectorAll('#sendBtn,#clearBtn,#drawSendBtn,#imgSendBtn,.shapeBtn')
    .forEach(b=>b.disabled=!val);

  if(val && imgPixels){
    document.getElementById('imgSendBtn').disabled=false;
  }
}

async function connect(){
  if(characteristic){
    characteristic=null;
    setConnected(false);
    return;
  }

  const device = await navigator.bluetooth.requestDevice({
    acceptAllDevices:true,
    optionalServices:[SERVICE_UUID]
  });

  const server  = await device.gatt.connect();
  const service = await server.getPrimaryService(SERVICE_UUID);
  characteristic = await service.getCharacteristic(CHAR_UUID);

  setConnected(true);

  device.addEventListener('gattserverdisconnected',()=>{
    characteristic=null;
    setConnected(false);
  });
}

// ── SEND CMD ──
async function sendCmd(cmd){
  if(!characteristic)return;
  await characteristic.writeValue(new TextEncoder().encode(cmd+'\n'));
}

// ── CHUNKED SENDER ──
async function sendRow(y, pixels){
  const CHUNK = 8;

  for(let start=0; start<240; start+=CHUNK){

    const count = Math.min(CHUNK,240-start);
    const row = new Uint8Array(6 + count*2);

    row[0]=73;row[1]=77;row[2]=71;row[3]=58;
    row[4]=(y>>8)&0xFF;
    row[5]=y&0xFF;

    for(let i=0;i<count;i++){
      const x=start+i;
      const idx=(y*240+x)*4;

      const r=pixels.data[idx];
      const g=pixels.data[idx+1];
      const b=pixels.data[idx+2];

      const rgb565=((r&0xF8)<<8)|((g&0xFC)<<3)|(b>>3);

      row[6+i*2]=(rgb565>>8)&0xFF;
      row[6+i*2+1]=rgb565&0xFF;
    }

    await characteristic.writeValueWithoutResponse(row.buffer);
  }
}

// ── DRAW SEND ──
async function sendDrawing(){
  const ctx=document.getElementById('drawCanvas').getContext('2d');
  const data=ctx.getImageData(0,0,240,240);

  await sendCmd('IMGSTART');
  await sleep(200);

  for(let y=0;y<240;y++){
    await sendRow(y,data);
  }

  log('Drawing sent');
}

// ── IMAGE LOAD ──
function loadImage(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();

    img.onload=()=>{
      const c=document.getElementById('imgCanvas');
      const cx=c.getContext('2d');

      const size=Math.min(img.width,img.height);
      const sx=(img.width-size)/2;
      const sy=(img.height-size)/2;

      cx.drawImage(img,sx,sy,size,size,0,0,240,240);

      imgPixels = cx.getImageData(0,0,240,240);

      c.style.display='block';
      document.getElementById('imgSendBtn').style.display='block';

      if(characteristic){
        document.getElementById('imgSendBtn').disabled=false;
      }
    };

    img.src=ev.target.result;
  };

  reader.readAsDataURL(file);
}

// ── IMAGE SEND ──
async function sendImage(){
  if(!characteristic||!imgPixels)return;

  await sendCmd('IMGSTART');
  await sleep(200);

  for(let y=0;y<240;y++){
    await sendRow(y,imgPixels);
  }

  log('Image sent');
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
</script>
